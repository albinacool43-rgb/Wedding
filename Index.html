<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f6f0;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            background-color: #fff;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 32px;
            color: #b58e5f;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .date {
            font-size: 24px;
            font-weight: bold;
            color: #b58e5f;
            margin: 30px 0;
        }
        .btn {
            display: inline-block;
            background-color: #b58e5f;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #9c764a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Приглашение на свадьбу</h1>
        <p>Дорогие друзья и близкие!</p>
        <p>С огромной радостью приглашаем вас разделить с нами самый счастливый день в нашей жизни — день нашей свадьбы.</p>
        <div class="date">15 Августа 2026</div>
        <p>Мы будем счастливы видеть вас на нашем празднике!</p>
        <a href="#" class="btn">Подтвердить присутствие</a>
    </div>
</body>
</html>
